name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: roll-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read

    env:
      DEPLOY_CONFIG_FILE: /tmp/roll-dashboard-deploy.env.local
      ROLL_WEBSITE_OUTPUT_DIR: /tmp/roll-website-images

    steps:
      - name: Show deployment source
        env:
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          if [ "$DEPLOY_EVENT_NAME" = "push" ]; then
            printf 'Deploying push to main\n'
            printf 'Commit: %s\n' "$DEPLOY_COMMIT_SHA"
            printf 'Message: %s\n' "$DEPLOY_COMMIT_MESSAGE"
          else
            printf 'Deploying manual workflow run from %s\n' "$GITHUB_REF"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure deployment environment
        env:
          DEPLOY_SERVER_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_PORT: ${{ secrets.DEPLOY_SERVER_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          ROLL_WEBSITE_REMOTE_DIR: ${{ secrets.ROLL_WEBSITE_REMOTE_DIR }}
        run: |
          : "${DEPLOY_SERVER_USER:?Missing DEPLOY_SERVER_USER secret}"
          : "${DEPLOY_SERVER_HOST:?Missing DEPLOY_SERVER_HOST secret}"
          : "${DEPLOY_SERVER_PORT:?Missing DEPLOY_SERVER_PORT secret}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_PRIVATE_KEY secret}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Missing DEPLOY_SSH_KNOWN_HOSTS secret}"
          : "${ROLL_WEBSITE_REMOTE_DIR:?Missing ROLL_WEBSITE_REMOTE_DIR secret}"

          case "$DEPLOY_SERVER_USER" in
            *[!A-Za-z0-9._-]*)
              echo "DEPLOY_SERVER_USER contains unsupported characters."
              exit 1
              ;;
          esac

          case "$DEPLOY_SERVER_HOST" in
            *[!A-Za-z0-9._-]*)
              echo "DEPLOY_SERVER_HOST contains unsupported characters."
              exit 1
              ;;
          esac

          case "$DEPLOY_SERVER_PORT" in
            *[!0-9]*)
              echo "DEPLOY_SERVER_PORT must be numeric."
              exit 1
              ;;
          esac

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat >"$HOME/.ssh/config" <<EOF
          Host ${DEPLOY_SERVER_HOST}
            HostName ${DEPLOY_SERVER_HOST}
            User ${DEPLOY_SERVER_USER}
            Port ${DEPLOY_SERVER_PORT}
            IdentityFile ${HOME}/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

          write_config_var() {
            printf '%s=%q\n' "$1" "$2" >>"$DEPLOY_CONFIG_FILE"
          }

          : >"$DEPLOY_CONFIG_FILE"
          chmod 600 "$DEPLOY_CONFIG_FILE"
          write_config_var DEPLOY_SERVER_USER "$DEPLOY_SERVER_USER"
          write_config_var DEPLOY_SERVER_HOST "$DEPLOY_SERVER_HOST"
          write_config_var DEPLOY_SERVER_PORT "$DEPLOY_SERVER_PORT"
          write_config_var ROLL_WEBSITE_REMOTE_DIR "$ROLL_WEBSITE_REMOTE_DIR"
          write_config_var ROLL_WEBSITE_OUTPUT_DIR "$ROLL_WEBSITE_OUTPUT_DIR"

      - name: Deploy
        run: pnpm deploy:server
